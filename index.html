<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chatbot Test</title>
</head>
<body>

<style>
  #chat-bubble {
    position: fixed; bottom: 24px; right: 24px;
    width: 60px; height: 60px; border-radius: 50%;
    background: #A2D2FF; color: #1A3A5A; border: none;
    font-size: 26px; cursor: pointer; z-index: 9999;
    box-shadow: 0 4px 20px rgba(162, 210, 255, 0.6);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s;
  }
  #chat-bubble:hover { transform: scale(1.1); }

  #chat-window {
    position: fixed; bottom: 96px; right: 24px;
    width: 370px; height: 520px;
    background: #fff; border-radius: 20px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.15);
    display: none; flex-direction: column;
    z-index: 9999; overflow: hidden;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  #chat-window.open { display: flex; }

  #chat-header {
    padding: 16px 20px; background: #A2D2FF; color: #1A3A5A;
    display: flex; align-items: center; justify-content: space-between;
  }
  #chat-header-left { display: flex; align-items: center; gap: 10px; }
  #chat-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(255,255,255,0.4);
    display: flex; align-items: center; justify-content: center; font-size: 18px;
  }
  #chat-title { font-weight: 600; font-size: 15px; }
  #chat-subtitle { font-size: 12px; opacity: 0.85; }
  #chat-close {
    background: none; border: none; color: #1A3A5A;
    font-size: 22px; cursor: pointer; opacity: 0.8;
  }
  #chat-close:hover { opacity: 1; }

  #chat-messages {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
    background: #F4F9FF;
  }

  .msg-row { display: flex; align-items: flex-end; gap: 8px; }
  .msg-row.user { flex-direction: row-reverse; }

  .msg-avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: #A2D2FF; color: #1A3A5A;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; flex-shrink: 0;
  }
  .msg-row.user .msg-avatar { background: #BDE0FE; color: #1A3A5A; }

  .msg {
    max-width: 75%; padding: 10px 14px;
    border-radius: 18px; font-size: 14px; line-height: 1.5;
  }
  .msg.bot {
    background: white; color: #111;
    border-bottom-left-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  }
  .msg.user {
    background: #A2D2FF; color: #1A3A5A;
    border-bottom-right-radius: 4px;
  }
  .msg.typing { color: #888; font-style: italic; background: white; }

  #chat-suggestions {
    display: flex; flex-wrap: wrap; gap: 6px;
    padding: 8px 16px 4px; background: #F4F9FF;
  }
  .chip {
    font-size: 12px; padding: 5px 12px;
    background: white; border: 1px solid #BDE0FE;
    border-radius: 20px; cursor: pointer; color: #1A3A5A;
  }
  .chip:hover { background: #BDE0FE; }

  #chat-input-row {
    display: flex; align-items: center;
    padding: 12px 16px; gap: 8px;
    background: white; border-top: 1px solid #EAF4FF;
  }
  #chat-input {
    flex: 1; padding: 10px 16px; border-radius: 24px;
    border: 1.5px solid #BDE0FE; font-size: 14px;
    outline: none; background: #F4F9FF; color: #1A3A5A;
  }
  #chat-input:focus { border-color: #A2D2FF; background: white; }
  #chat-input::placeholder { color: #8AABCE; }
  #chat-send {
    width: 40px; height: 40px; border-radius: 50%;
    background: #A2D2FF; color: #1A3A5A; border: none;
    font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  #chat-send:hover { background: #8ECAE6; }
  #chat-send:disabled { background: #ccc; cursor: not-allowed; }
</style>

<button id="chat-bubble" onclick="toggleChat()">💬</button>

<div id="chat-window">
  <div id="chat-header">
    <div id="chat-header-left">
      <div id="chat-avatar">🛍️</div>
      <div>
        <div id="chat-title">Store Assistant</div>
        <div id="chat-subtitle">Powered by Groq AI</div>
      </div>
    </div>
    <button id="chat-close" onclick="toggleChat()">×</button>
  </div>

  <div id="chat-messages">
    <div class="msg-row bot">
      <div class="msg-avatar">🤖</div>
      <div class="msg bot">Hi there! 👋 I'm your store assistant. Ask me anything about products, orders, returns, or shipping!</div>
    </div>
  </div>

  <div id="chat-suggestions">
    <button class="chip" onclick="useChip(this)">What's your return policy?</button>
    <button class="chip" onclick="useChip(this)">How long does shipping take?</button>
    <button class="chip" onclick="useChip(this)">Do you have blue shirts?</button>
  </div>

  <div id="chat-input-row">
    <input id="chat-input" type="text" placeholder="Type a message..."
      onkeydown="if(event.key==='Enter') sendMessage()" />
    <button id="chat-send" onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
  // Same origin when opened via http://localhost:3002/ ; fallback for file:// testing
  const BACKEND_URL = (window.location.protocol === 'http:' || window.location.protocol === 'https:')
    ? window.location.origin
    : 'http://localhost:3002';
  let chatHistory = [];
  let isTyping = false;

  function toggleChat() {
    document.getElementById('chat-window').classList.toggle('open');
  }

  function useChip(btn) {
    document.getElementById('chat-input').value = btn.textContent;
    document.getElementById('chat-suggestions').style.display = 'none';
    sendMessage();
  }

  function appendMessage(text, role) {
    const messages = document.getElementById('chat-messages');
    const isUser = role === 'user';

    const row = document.createElement('div');
    row.className = `msg-row ${isUser ? 'user' : 'bot'}`;

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = isUser ? '👤' : '🤖';

    const bubble = document.createElement('div');
    bubble.className = `msg ${isUser ? 'user' : 'bot'}`;
    bubble.textContent = text;

    if (isUser) {
      row.appendChild(bubble);
      row.appendChild(avatar);
    } else {
      row.appendChild(avatar);
      row.appendChild(bubble);
    }

    messages.appendChild(row);
    messages.scrollTop = messages.scrollHeight;
    return bubble;
  }

  function showTyping() {
    const messages = document.getElementById('chat-messages');
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.id = 'typing-row';
    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = '🤖';
    const bubble = document.createElement('div');
    bubble.className = 'msg bot typing';
    bubble.textContent = 'Typing...';
    row.appendChild(avatar);
    row.appendChild(bubble);
    messages.appendChild(row);
    messages.scrollTop = messages.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typing-row');
    if (el) el.remove();
  }

  async function sendMessage() {
    if (isTyping) return;
    const input = document.getElementById('chat-input');
    const message = input.value.trim();
    if (!message) return;

    input.value = '';
    document.getElementById('chat-send').disabled = true;
    document.getElementById('chat-suggestions').style.display = 'none';
    appendMessage(message, 'user');

    isTyping = true;
    showTyping();

    try {
      const res = await fetch(`${BACKEND_URL}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, history: chatHistory })
      });

      let data;
      try {
        data = await res.json();
      } catch {
        removeTyping();
        appendMessage('Server returned an invalid response. Is the backend running?', 'bot');
        return;
      }

      removeTyping();

      if (!res.ok) {
        const detail = data.detail || data.message || 'Something went wrong on the server.';
        appendMessage(typeof detail === 'string' ? detail : JSON.stringify(detail), 'bot');
        return;
      }

      if (data.error || !data.reply) {
        appendMessage('Sorry, something went wrong.', 'bot');
        return;
      }

      appendMessage(data.reply, 'bot');
      chatHistory.push({ role: 'user', content: message });
      chatHistory.push({ role: 'assistant', content: data.reply });
      if (chatHistory.length > 10) chatHistory = chatHistory.slice(-10);

    } catch (err) {
      removeTyping();
      appendMessage(
        'Could not reach the server. Start it with "python app.py" and open http://localhost:3002/',
        'bot'
      );
    }

    isTyping = false;
    document.getElementById('chat-send').disabled = false;
  }
</script>

</body>
</html>
